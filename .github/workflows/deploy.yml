name: Deploy (OVH via FTP)

# Ne se déclenche que sur main, donc seulement après une PR mergée depuis dev
# (branch protection empêche le push direct sur main, voir README ou CLAUDE.md).
on:
  push:
    branches: [main]
  workflow_dispatch: {} # permet de relancer un déploiement manuellement depuis l'onglet Actions

concurrency:
  group: deploy-production
  cancel-in-progress: false # on ne coupe jamais un déploiement en cours

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Garde-fou supplémentaire : nécessite l'environnement "production" côté
    # GitHub (Settings > Environments), sur lequel on peut exiger une
    # validation manuelle avant que le job ne parte.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Re-vérifie tout avant de déployer, même si la CI a déjà tourné sur la PR.
      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Déploiement FTP vers OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # .htaccess vient maintenant de public/.htaccess (versionné, dans
          # le build) donc il est déployé normalement. Ne supprime jamais
          # côté serveur les fichiers absents du build (pages HTML
          # pré-rendues pour les bots, vérif Google...).
          dangerous-clean-slate: false
          exclude: |
            **/google*.html
